# ---------------------------------------------------------------
# Theme Settings
# ---------------------------------------------------------------

# Dark Mode
darkmode: true

# Schemes
scheme: Muse
# scheme: Mist
# scheme: Pisces
# scheme: Gemini

# ---------------------------------------------------------------
# Menu Settings
# ---------------------------------------------------------------

menu:
  home: / || fa fa-home
  about: /about/ || fa fa-user
  photography: /photography/ || fa fa-camera
  projects: /projects/ || fa fa-code
  algorithm-design: /algorithm-design/ || fa fa-book
  archives: /archives/ || fa fa-archive
  tags: /tags/ || fa fa-tags
  # categories: /categories/ || fa fa-th

# ---------------------------------------------------------------
# Social Settings
# ---------------------------------------------------------------

social:
  GitHub: https://github.com/GerateGuo || fab fa-github
  E-Mail: mailto:vitacookie@qq.com || fa fa-envelope

# ---------------------------------------------------------------
# Search Settings
# ---------------------------------------------------------------

# 站内搜索（依赖 hexo-generator-searchdb）
# 修改原因：站点原本没有搜索入口，文章多起来后只能靠浏览器翻页找内容
local_search:
  enable: true
  trigger: auto
  top_n_per_article: 1
  unescape: true
  preload: false

# ---------------------------------------------------------------
# Content Settings
# ---------------------------------------------------------------

# Enable/Disable table of content
toc:
  enable: true
  number: true
  max_depth: 3

# ---------------------------------------------------------------
# Miscellaneous
# ---------------------------------------------------------------

# Font Settings
font:
  enable: true
  host: https://fonts.googleapis.com
  global:
    external: true
    family: Noto Sans SC
    size: 1

# Back to top button
back2top:
  enable: true
  sidebar: false
  scrollpercent: true

# Reading progress
reading_progress:
  enable: true
  position: top
  color: "#666"
  height: 3px

# Image settings for photography
post_asset_folder: true
relative_link: false

# ---------------------------------------------------------------
# Statistics - Visitor Count
# ---------------------------------------------------------------
busuanzi_count:
  enable: true
  total_visitors: true
  total_visitors_icon: fa fa-user
  total_views: true
  total_views_icon: fa fa-eye
  post_views: true
  post_views_icon: far fa-eye

# ---------------------------------------------------------------
# Custom Styles - 液态玻璃效果
# ---------------------------------------------------------------
custom_css: /css/liquid-glass.css