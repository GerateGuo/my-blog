# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: Gerate's Blog
subtitle: '个人博客'
description: '记录生活、技术与创意'
keywords: blog, photography, projects
author: Gerate Guo
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
# 修改原因：本站部署在 GitHub Pages 的子路径 /my-blog/ 下（见下面的 root）。
# Hexo 要求这种「项目站点」的 url 必须把子路径一并写进去，否则所有由
# url + 路径 拼出来的绝对地址（页面 canonical、og:url、sitemap.xml、atom.xml）
# 都会丢掉 /my-blog/ 前缀，指向 404 地址。root 保持 /my-blog/ 不变即可。
url: https://gerateguo.github.io/my-blog
root: /my-blog/
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: next

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: git
  repo: https://github.com/GerateGuo/my-blog.git
  branch: gh-pages
  message: "Site updated: {{ now('YYYY-MM-DD HH:mm:ss') }}"

# Sitemap（插件 hexo-generator-sitemap）
# 修改原因：站点原本没有站点地图，搜索引擎收录只能靠爬链接，收录慢且不完整
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Feed（插件 hexo-generator-feed）
# 修改原因：原本没有订阅源，读者无法通过 RSS 阅读器订阅更新
feed:
  type: atom
  path: atom.xml
  limit: 20
  hub:
  content: true

# 站内搜索索引（插件 hexo-generator-searchdb，NexT 的 local_search 依赖它）
# 修改原因：不配这一段插件不会生成 search.xml，导航栏的搜索框点了会查不到东西
search:
  path: search.xml
  field: post
  content: true
  format: html


